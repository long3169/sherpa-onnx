name: Build sherpa-onnx iOS single xcframework

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install brew dependencies
        run: |
          brew install cmake

      - name: Build iOS
        run: |
          chmod +x ./build-ios.sh
          ./build-ios.sh

      - name: Upload output (xcframework + header include)
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-ios-full
          path: |
            build-ios/sherpa-onnx.xcframework
            build-ios/install/include

