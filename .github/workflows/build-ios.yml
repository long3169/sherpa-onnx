name: Build sherpa-onnx iOS single xcframework

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          brew install cmake

      - name: Build iOS
        run: |
          chmod +x ./build-ios.sh
          ./build-ios.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-onnx-ios-xcframework
          path: build-ios/sherpa-onnx.xcframework
